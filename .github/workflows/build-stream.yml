name: Build Skym3u Rotating Promo Stream

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generate Rotating Modern Promo Stream
        run: |
          mkdir -p stream

          # Pick 1 of 3 modern themes randomly on each run
          THEME=$(( (RANDOM % 3) + 1 ))
          echo "Selected Promo Theme: $THEME"

          FONT_BOLD="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          FONT_REG="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          TICKER_TEXT="★ Skym3u  |  Fresh M3U Playlists  |  VLC & TiviMate Guides  |  www.skym3u.dev ★"

          if [ "$THEME" -eq 1 ]; then
            # Theme 1: Cyber Neon
            BG="gradients=s=1280x720:r=30:d=30:c0=#050811:c1=#0f172a:c2=#1e1b4b:c3=#0c4a6e:speed=0.07"
            B1="drawbox=x=110:y=135:w=1060:h=390:color=black@0.78:t=fill"
            B2="drawbox=x=110:y=135:w=1060:h=4:color=#38bdf8:t=fill"
            B3="drawbox=x=110:y=521:w=1060:h=4:color=#facc15:t=fill"
            B4="drawbox=x=50:y=38:w=135:h=38:color=#dc2626:t=fill"
            T1="drawtext=fontfile=$FONT_BOLD:text='LIVE':fontcolor=white:fontsize=18:x=92:y=48"
            T2="drawtext=fontfile=$FONT_BOLD:text='SKYM3U':fontcolor=#38bdf8:fontsize=34:x=(w-text_w)/2:y=180"
            T3="drawtext=fontfile=$FONT_BOLD:text='Next-Gen M3U & IPTV Hub':fontcolor=#facc15:fontsize=44:x=(w-text_w)/2:y=242:shadowcolor=black:shadowx=3:shadowy=3"
            T4="drawtext=fontfile=$FONT_REG:text='VLC & TiviMate Setup Made Simple':fontcolor=white:fontsize=28:x=(w-text_w)/2:y=328:shadowcolor=black:shadowx=2:shadowy=2"
            T5="drawtext=fontfile=$FONT_BOLD:text='www.skym3u.dev':fontcolor=#4ade80:fontsize=32:x=(w-text_w)/2:y=412"
            TBG="drawbox=x=0:y=656:w=1280:h=64:color=#020617@0.95:t=fill"
            TLN="drawbox=x=0:y=656:w=1280:h=2:color=#38bdf8:t=fill"
            TTX="drawtext=fontfile=$FONT_BOLD:text='$TICKER_TEXT':fontcolor=#e2e8f0:fontsize=22:x=w-mod(t*150\,w+tw):y=676"
            FILTERS="$B1,$B2,$B3,$B4,$T1,$T2,$T3,$T4,$T5,$TBG,$TLN,$TTX"

          elif [ "$THEME" -eq 2 ]; then
            # Theme 2: Emerald Broadcast
            BG="gradients=s=1280x720:r=30:d=30:c0=#041310:c1=#064e3b:c2=#0f172a:c3=#115e59:speed=0.06"
            B1="drawbox=x=100:y=125:w=1080:h=410:color=#020c0a@0.82:t=fill"
            B2="drawbox=x=100:y=125:w=6:h=410:color=#34d399:t=fill"
            B3="drawbox=x=1174:y=125:w=6:h=410:color=#fbbf24:t=fill"
            B4="drawbox=x=1060:y=38:w=170:h=38:color=#059669:t=fill"
            T1="drawtext=fontfile=$FONT_BOLD:text='HD STREAM':fontcolor=white:fontsize=17:x=1092:y=49"
            T2="drawtext=fontfile=$FONT_BOLD:text='SKYM3U CHANNEL':fontcolor=#34d399:fontsize=30:x=(w-text_w)/2:y=172"
            T3="drawtext=fontfile=$FONT_BOLD:text='Updated M3U Playlists Daily':fontcolor=white:fontsize=44:x=(w-text_w)/2:y=238:shadowcolor=black:shadowx=3:shadowy=3"
            T4="drawtext=fontfile=$FONT_REG:text='Complete VLC & TiviMate Tutorials':fontcolor=#fde68a:fontsize=28:x=(w-text_w)/2:y=324:shadowcolor=black:shadowx=2:shadowy=2"
            T5="drawtext=fontfile=$FONT_BOLD:text='Visit\\: www.skym3u.dev':fontcolor=#fbbf24:fontsize=30:x=(w-text_w)/2:y=415"
            TBG="drawbox=x=0:y=656:w=1280:h=64:color=#03120f@0.95:t=fill"
            TLN="drawbox=x=0:y=656:w=1280:h=2:color=#34d399:t=fill"
            TTX="drawtext=fontfile=$FONT_BOLD:text='$TICKER_TEXT':fontcolor=#ecfdf5:fontsize=22:x=w-mod(t*150\,w+tw):y=676"
            FILTERS="$B1,$B2,$B3,$B4,$T1,$T2,$T3,$T4,$T5,$TBG,$TLN,$TTX"

          else
            # Theme 3: Crimson Cinema
            BG="gradients=s=1280x720:r=30:d=30:c0=#140508:c1=#450a0a:c2=#18181b:c3=#7f1d1d:speed=0.065"
            B1="drawbox=x=130:y=140:w=1020:h=380:color=#09090b@0.82:t=fill"
            B2="drawbox=x=130:y=140:w=1020:h=3:color=#f87171:t=fill"
            B3="drawbox=x=130:y=517:w=1020:h=3:color=#f87171:t=fill"
            B4="drawbox=x=50:y=38:w=150:h=38:color=#b91c1c:t=fill"
            T1="drawtext=fontfile=$FONT_BOLD:text='ON AIR':fontcolor=white:fontsize=18:x=88:y=48"
            T2="drawtext=fontfile=$FONT_BOLD:text='SKYM3U':fontcolor=#f87171:fontsize=34:x=(w-text_w)/2:y=182"
            T3="drawtext=fontfile=$FONT_BOLD:text='Smooth M3U & IPTV Guides':fontcolor=#fef08a:fontsize=44:x=(w-text_w)/2:y=244:shadowcolor=black:shadowx=3:shadowy=3"
            T4="drawtext=fontfile=$FONT_REG:text='VLC & TiviMate Player Walkthroughs':fontcolor=#e4e4e7:fontsize=28:x=(w-text_w)/2:y=328:shadowcolor=black:shadowx=2:shadowy=2"
            T5="drawtext=fontfile=$FONT_BOLD:text='www.skym3u.dev':fontcolor=#fca5a5:fontsize=32:x=(w-text_w)/2:y=414"
            TBG="drawbox=x=0:y=656:w=1280:h=64:color=#09090b@0.95:t=fill"
            TLN="drawbox=x=0:y=656:w=1280:h=2:color=#f87171:t=fill"
            TTX="drawtext=fontfile=$FONT_BOLD:text='$TICKER_TEXT':fontcolor=#fafafa:fontsize=22:x=w-mod(t*150\,w+tw):y=676"
            FILTERS="$B1,$B2,$B3,$B4,$T1,$T2,$T3,$T4,$T5,$TBG,$TLN,$TTX"
          fi

          ffmpeg -f lavfi -i "$BG" -vf "$FILTERS" \
          -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
          -hls_time 5 -hls_list_size 0 -f hls stream/stream.m3u8

      - name: Commit and Push Stream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stream/
          git commit -m "Build rotating Skym3u promo stream" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
