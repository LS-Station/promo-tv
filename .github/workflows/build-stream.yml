name: Generate Promo Stream

on:
  push:
    paths:
      - 'messages.txt'
      - '.github/workflows/build-stream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & Download Font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget
          # একদম স্টেবল সিডিএন থেকে ইউনিকোড ফন্ট ডাউনলোড নিশ্চিত করা হলো
          wget -O font.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansbengali/NotoSansBengali-Regular.ttf"

      - name: Generate Animated M3U8 Stream
        run: |
          mkdir -p stream
          # টেক্সট নিচ থেকে ওপরের দিকে স্মুথলি মুভ করার অ্যানিমেশন এবং হলুদ কালার
          ffmpeg -f lavfi -i color=c=black:s=1280x720:r=30 -t 20 \
          -vf "drawtext=fontfile=font.ttf:textfile=messages.txt:fontcolor=yellow:fontsize=52:x=(w-text_w)/2:y=h-(t*50):shadowcolor=black:shadowx=3:shadowy=3" \
          -c:v libx264 -preset veryfast -g 60 -sc_threshold 0 \
          -hls_time 5 -hls_list_size 0 -hls_segment_filename "stream/seg_%03d.ts" \
          stream/stream.m3u8

      - name: Push to GitHub
        run: |
          git config user.name "Auto Bot"
          git config user.email "bot@github.com"
          git add stream/ font.ttf
          git commit -m "Update working font and animated stream" || exit 0
          git push
