name: Build Pro IPTV Stream

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generate Animated Promo Stream
        run: |
          mkdir -p stream
          ffmpeg -f lavfi -i "gradients=s=1280x720:r=30:d=30:c0=#090d16:c1=#1e3a8a:c2=#0f172a:c3=#312e81:speed=0.05" \
          -vf "drawbox=x=0:y=210:w=1280:h=290:color=black@0.65:t=fill, \
               drawbox=x=0:y=210:w=1280:h=4:color=#facc15:t=fill, \
               drawbox=x=0:y=496:w=1280:h=4:color=#facc15:t=fill, \
               drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Welcome to our IPTV channel!':fontcolor=#facc15:fontsize=48:x=(w-text_w)/2:y=265:shadowcolor=black:shadowx=3:shadowy=3, \
               drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Stay with us for regular updates.':fontcolor=white:fontsize=32:x=(w-text_w)/2:y=365:shadowcolor=black:shadowx=2:shadowy=2" \
          -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
          -hls_time 5 -hls_list_size 0 -f hls stream/stream.m3u8

      - name: Commit and Push Stream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stream/
          git commit -m "Build animated promo stream" || echo "No changes to commit"
          git push
