name: Generate Pro Promo Stream

on:
  push:
    paths:
      - 'messages.txt'
      - '.github/workflows/build-stream.yml'
      - 'font.ttf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & Fontconfig
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig

      - name: Build Professional M3U8 Stream
        run: |
          mkdir -p stream
          
          # ইউনিকোড সাবটাইটেল ফাইল তৈরি (বাংলা যুক্তক্ষর ও ফন্ট ঠিক রাখতে)
          echo "1" > promo.srt
          echo "00:00:00,000 --> 00:00:30,000" >> promo.srt
          cat messages.txt >> promo.srt

          # ফন্ট ডিরেক্টরি সেট করে নিখুঁত সাবটাইটেল রেন্ডারিং
          ffmpeg -f lavfi -i color=c=0x0a0a0a:s=1280x720:r=30 -t 30 \
          -vf "subtitles=promo.srt:force_style='Fontfile=font.ttf,FontSize=32,PrimaryColour=&H00FFFF&,OutlineColour=&H000000&,BorderStyle=3,Outline=2,Shadow=2,Alignment=2'" \
          -c:v libx264 -preset veryfast -g 60 -sc_threshold 0 \
          -hls_time 5 -hls_list_size 0 -hls_segment_filename "stream/seg_%03d.ts" \
          stream/stream.m3u8

      - name: Push to GitHub
        run: |
          git config user.name "Promo Bot"
          git config user.email "bot@github.com"
          git add stream/
          git commit -m "Fix font rendering and build professional stream" || exit 0
          git push
