name: Build Pro IPTV Stream

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generate Professional HLS Stream
        run: |
          mkdir -p stream
          # promo.mp4 হলো আপনার আপলোড করা ভিডিও, আর font.ttf হলো আপনার ফন্ট ফাইল
          ffmpeg -stream_loop -1 -i promo.mp4 -i font.ttf \
          -filter_complex \
          "[0:v]scale=1280:720,setsar=1[v0]; \
           [v0]drawbox=x=0:y=220:w=1280:h=280:color=black@0.6:t=fill[v1]; \
           [v1]drawtext=fontfile='font.ttf':text='Welcome to our IPTV channel!':fontcolor=#facc15:fontsize=46:x=(w-text_w)/2:y=270:shadowcolor=black:shadowx=3:shadowy=3[v2]; \
           [v2]drawtext=fontfile='font.ttf':text='Stay with us for regular updates.':fontcolor=white:fontsize=32:x=(w-text_w)/2:y=360:shadowcolor=black:shadowx=2:shadowy=2[v]" \
          -map "[v]" -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
          -hls_time 4 -hls_list_size 5 -hls_flags delete_segments \
          stream/stream.m3u8

      - name: Commit and Push Stream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stream/
          git commit -m "Update professional video promo stream" || echo "No changes to commit"
          git push
