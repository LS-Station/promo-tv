name: Build Skym3u Ultimate Promo Stream

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      include_audio:
        description: "Include the built-in original Skym3u background soundtrack"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: skym3u-promo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Render clean watermark promo from stadium video
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p stream build
          rm -f stream/*.ts stream/*.m3u8 build/*.mp4 build/*.txt

          BG_VIDEO="video_1.mp4"
          test -f "$BG_VIDEO"

          FONT_BOLD="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          FONT_REG="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          test -f "$FONT_BOLD"
          test -f "$FONT_REG"

          # Clean, minimal watermark-style overlays over the stadium footage
          filters="scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,setsar=1,"
          filters+="drawtext=fontfile=${FONT_BOLD}:text='SKYM3U':fontcolor=white@0.40:fontsize=54:x=(w-text_w)/2:y=(h-text_h)/2-26:shadowcolor=black@0.25:shadowx=2:shadowy=2,"
          filters+="drawtext=fontfile=${FONT_REG}:text='www.skym3u.dev':fontcolor=white@0.35:fontsize=26:x=(w-text_w)/2:y=(h-text_h)/2+34:shadowcolor=black@0.25:shadowx=1:shadowy=1,"
          filters+="drawtext=fontfile=${FONT_BOLD}:text='SKYM3U':fontcolor=white@0.28:fontsize=20:x=w-tw-36:y=h-th-28"

          ffmpeg -hide_banner -loglevel error -y \
            -stream_loop -1 -i "$BG_VIDEO" \
            -vf "$filters" \
            -t 60 -r 30 \
            -c:v libx264 -preset veryfast -crf 22 \
            -pix_fmt yuv420p -an -movflags +faststart \
            build/promo-silent.mp4

- name: Create original Skym3u background soundtrack
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import math, wave, struct

          sample_rate = 48000
          duration = 60
          total = sample_rate * duration
          output = "build/skym3u-original-soundtrack.wav"

          chords = [
              [261.63, 329.63, 392.00, 493.88],
              [220.00, 261.63, 329.63, 392.00],
              [174.61, 220.00, 261.63, 329.63],
              [196.00, 246.94, 293.66, 392.00],
          ]
          melody = [523.25, 587.33, 659.25, 587.33, 493.88, 440.00,
                    392.00, 440.00, 493.88, 587.33, 523.25, 392.00]

          with wave.open(output, "wb") as wav:
              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)
              block = 4800
              for base in range(0, total, block):
                  frames = bytearray()
                  for n in range(base, min(base + block, total)):
                      t = n / sample_rate
                      scene = min(3, int(t // 15))
                      chord = chords[scene]
                      pad = sum(math.sin(2 * math.pi * f * t) for f in chord) / 4
                      pad += 0.22 * sum(math.sin(2 * math.pi * (f * 2) * t) for f in chord) / 4
                      pulse = 0.78 + 0.22 * math.sin(2 * math.pi * 0.12 * t)
                      beat = int(t / 2.5)
                      note_freq = melody[beat % len(melody)]
                      note_age = t - beat * 2.5
                      bell_env = math.exp(-2.8 * note_age) if note_age < 2.2 else 0.0
                      bell = math.sin(2 * math.pi * note_freq * t) * bell_env
                      bell += 0.25 * math.sin(2 * math.pi * note_freq * 2.01 * t) * bell_env
                      fade_in = min(1.0, t / 2.0)
                      fade_out = min(1.0, (duration - t) / 3.0)
                      envelope = max(0.0, min(fade_in, fade_out))
                      sample = (0.105 * pad * pulse + 0.045 * bell) * envelope
                      left = max(-0.95, min(0.95, sample * (0.98 + 0.02 * math.sin(2 * math.pi * 0.07 * t))))
                      right = max(-0.95, min(0.95, sample * (0.98 - 0.02 * math.sin(2 * math.pi * 0.07 * t))))
                      frames.extend(struct.pack("<hh", int(left * 32767), int(right * 32767)))
                  wav.writeframes(frames)
          print(f"Created original 60-second soundtrack: {output}")
          PYCODE

- name: Add built-in background music
        shell: bash
        env:
          INCLUDE_AUDIO: ${{ github.event_name != 'workflow_dispatch' || inputs.include_audio }}
        run: |
          set -euo pipefail

          if [[ "${INCLUDE_AUDIO:-true}" == "true" ]]; then
            ffmpeg -hide_banner -loglevel error -y \
              -i build/promo-silent.mp4 \
              -i build/skym3u-original-soundtrack.wav \
              -map 0:v:0 -map 1:a:0 \
              -t 60 \
              -c:v copy \
              -c:a aac -b:a 128k -ar 48000 -ac 2 \
              -shortest \
              -movflags +faststart \
              build/promo-final.mp4
            echo "Original Skym3u background soundtrack enabled."
          else
            cp build/promo-silent.mp4 build/promo-final.mp4
            echo "Audio disabled by workflow input."
          fi

- name: Package as HLS
        run: |
          set -euo pipefail

          ffmpeg -hide_banner -loglevel error -y \
            -i build/promo-final.mp4 \
            -map 0:v:0 -map 0:a? \
            -c:v libx264 -preset veryfast -crf 22 \
            -pix_fmt yuv420p -r 30 \
            -g 150 -keyint_min 150 -sc_threshold 0 \
            -force_key_frames "expr:gte(t,n_forced*5)" \
            -c:a aac -b:a 128k -ar 48000 \
            -f hls \
            -hls_time 5 \
            -hls_list_size 0 \
            -hls_playlist_type vod \
            -hls_flags independent_segments \
            -hls_segment_filename "stream/segment_%03d.ts" \
            stream/stream.m3u8

          echo "HLS output:"
          ls -lh stream/
          test -s stream/stream.m3u8

- name: Commit and push HLS stream
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stream/
          if git diff --cached --quiet; then
            echo "No HLS changes to commit."
            exit 0
          fi

          git commit -m "Build Skym3u clean watermark promo stream"
          git push origin "HEAD:${GITHUB_REF_NAME}"
