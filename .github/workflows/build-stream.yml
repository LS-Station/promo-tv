name: Build Skym3u Ultimate Promo Stream

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      include_audio:
        description: "Include the built-in original Skym3u background soundtrack"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: skym3u-promo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Render four-scene Skym3u promo
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p stream build
          rm -f stream/*.ts stream/*.m3u8 build/*.mp4 build/*.txt

          FONT_BOLD="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          FONT_REG="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          test -f "$FONT_BOLD"
          test -f "$FONT_REG"

          render_scene() {
            local output="$1"
            local c0="$2"
            local c1="$3"
            local c2="$4"
            local c3="$5"
            local accent="$6"
            local accent2="$7"
            local headline="$8"
            local subline="$9"
            local badge="${10}"

            local filters
            filters="drawbox=x=72:y=72:w=1136:h=576:color=black@0.36:t=fill,"
            filters+="drawbox=x=72:y=72:w=1136:h=5:color=${accent}:t=fill,"
            filters+="drawbox=x=72:y=643:w=1136:h=5:color=${accent2}:t=fill,"
            filters+="drawbox=x=72:y=72:w=5:h=576:color=${accent}:t=fill,"
            filters+="drawbox=x=1208:y=72:w=5:h=576:color=${accent2}:t=fill,"
            filters+="drawbox=x=0:y=0:w=1280:h=2:color=${accent}@0.45:t=fill,"
            filters+="drawbox=x=mod(t*95\,1280):y=0:w=3:h=720:color=${accent}@0.22:t=fill,"
            filters+="drawbox=x=0:y=0:w=1280:h=92:color=black@0.20:t=fill,"
            filters+="drawbox=x=0:y=630:w=1280:h=90:color=black@0.88:t=fill,"
            filters+="drawbox=x=0:y=630:w=1280:h=3:color=${accent}:t=fill,"
            filters+="drawbox=x=78:y=105:w=154:h=42:color=${accent}@0.95:t=fill,"
            filters+="drawtext=fontfile=${FONT_BOLD}:text='${badge}':fontcolor=white:fontsize=19:x=105:y=116,"
            filters+="drawtext=fontfile=${FONT_BOLD}:text='SKYM3U':fontcolor=white:fontsize=34:x=78:y=34:shadowcolor=black@0.6:shadowx=2:shadowy=2,"
            filters+="drawtext=fontfile=${FONT_REG}:text='NEXT-GEN IPTV PLAYLIST HUB':fontcolor=white@0.88:fontsize=17:x=910:y=47,"
            filters+="drawtext=fontfile=${FONT_BOLD}:text='${headline}':fontcolor=white:fontsize=48:x=(w-text_w)/2:y=235:shadowcolor=black@0.75:shadowx=3:shadowy=3,"
            filters+="drawtext=fontfile=${FONT_REG}:text='${subline}':fontcolor=white@0.94:fontsize=27:x=(w-text_w)/2:y=322:shadowcolor=black@0.6:shadowx=2:shadowy=2,"
            filters+="drawbox=x=420:y=390:w=440:h=3:color=${accent2}:t=fill,"
            filters+="drawtext=fontfile=${FONT_BOLD}:text='www.skym3u.dev':fontcolor=${accent2}:fontsize=34:x=(w-text_w)/2:y=430:shadowcolor=black@0.65:shadowx=2:shadowy=2,"
            filters+="drawtext=fontfile=${FONT_REG}:text='PLAYLISTS  |  PLAYER GUIDES  |  EASY SETUP':fontcolor=white@0.82:fontsize=18:x=(w-text_w)/2:y=500,"
            filters+="drawtext=fontfile=${FONT_BOLD}:text='SKYM3U  *  FRESH PLAYLISTS  *  SIMPLE SETUP  *  VISIT SKYM3U.DEV':fontcolor=white:fontsize=20:x=w-mod(t*155\,w+tw):y=663"

            ffmpeg -hide_banner -loglevel error -y \
              -f lavfi \
              -i "gradients=s=1280x720:r=30:d=15:c0=${c0}:c1=${c1}:c2=${c2}:c3=${c3}:speed=0.07" \
              -vf "$filters" \
              -t 15 -r 30 \
              -c:v libx264 -preset veryfast -crf 22 \
              -pix_fmt yuv420p -an \
              "$output"
          }

          # Scene 1 — Ultra Cyber Glass
          render_scene "build/scene1.mp4" \
            "#050816" "#101b3a" "#172554" "#075985" \
            "#38bdf8" "#a78bfa" \
            "NEXT-GEN IPTV EXPERIENCE" \
            "Discover a smarter way to explore M3U playlists" \
            "DIGITAL BROADCAST"

          # Scene 2 — Luxury Emerald & Gold
          render_scene "build/scene2.mp4" \
            "#031b16" "#064e3b" "#022c22" "#713f12" \
            "#34d399" "#fbbf24" \
            "FRESH PLAYLISTS. EVERY DAY." \
            "A clean destination for playlist and player guides" \
            "PREMIUM EDITION"

          # Scene 3 — Cinema Motion
          render_scene "build/scene3.mp4" \
            "#16060d" "#4a1028" "#271044" "#7f1d1d" \
            "#fb7185" "#c4b5fd" \
            "YOUR ENTERTAINMENT. YOUR WAY." \
            "Explore guides for VLC, TiviMate and more" \
            "CINEMA SERIES"

          # Scene 4 — Professional TV Broadcast
          render_scene "build/scene4.mp4" \
            "#071426" "#12345a" "#0f172a" "#164e63" \
            "#22d3ee" "#facc15" \
            "WELCOME TO SKYM3U" \
            "Helpful IPTV resources with a modern experience" \
            "ON AIR"

          # Join the four 15-second scenes into one 60-second sequence.
          for file in scene1 scene2 scene3 scene4; do
            printf "file '%s'\n" "$PWD/build/${file}.mp4" >> build/concat.txt
          done

          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i build/concat.txt \
            -c:v libx264 -preset veryfast -crf 22 \
            -pix_fmt yuv420p -r 30 \
            -an -movflags +faststart \
            build/promo-silent.mp4

      - name: Create original Skym3u background soundtrack
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import math, wave, struct

          sample_rate = 48000
          duration = 60
          total = sample_rate * duration
          output = "build/skym3u-original-soundtrack.wav"

          # Original, royalty-free ambient synth bed: four gentle chord scenes.
          # No external audio file, download, or third-party music is required.
          chords = [
              [261.63, 329.63, 392.00, 493.88],  # Cmaj7
              [220.00, 261.63, 329.63, 392.00],  # Am7
              [174.61, 220.00, 261.63, 329.63],  # Fmaj7
              [196.00, 246.94, 293.66, 392.00],  # Gsus2/G
          ]
          melody = [523.25, 587.33, 659.25, 587.33, 493.88, 440.00,
                    392.00, 440.00, 493.88, 587.33, 523.25, 392.00]

          with wave.open(output, "wb") as wav:
              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)
              block = 4800
              for base in range(0, total, block):
                  frames = bytearray()
                  for n in range(base, min(base + block, total)):
                      t = n / sample_rate
                      scene = min(3, int(t // 15))
                      chord = chords[scene]
                      # Slow, soft pad with subtle movement.
                      pad = sum(math.sin(2 * math.pi * f * t) for f in chord) / 4
                      pad += 0.22 * sum(math.sin(2 * math.pi * (f * 2) * t) for f in chord) / 4
                      pulse = 0.78 + 0.22 * math.sin(2 * math.pi * 0.12 * t)
                      # Gentle bell-like notes, one note every 2.5 seconds.
                      beat = int(t / 2.5)
                      note_freq = melody[beat % len(melody)]
                      note_age = t - beat * 2.5
                      bell_env = math.exp(-2.8 * note_age) if note_age < 2.2 else 0.0
                      bell = math.sin(2 * math.pi * note_freq * t) * bell_env
                      bell += 0.25 * math.sin(2 * math.pi * note_freq * 2.01 * t) * bell_env
                      # Fade gently at the beginning and end for clean playback.
                      fade_in = min(1.0, t / 2.0)
                      fade_out = min(1.0, (duration - t) / 3.0)
                      envelope = max(0.0, min(fade_in, fade_out))
                      sample = (0.105 * pad * pulse + 0.045 * bell) * envelope
                      # Very subtle stereo width; keep the center image stable.
                      left = max(-0.95, min(0.95, sample * (0.98 + 0.02 * math.sin(2 * math.pi * 0.07 * t))))
                      right = max(-0.95, min(0.95, sample * (0.98 - 0.02 * math.sin(2 * math.pi * 0.07 * t))))
                      frames.extend(struct.pack("<hh", int(left * 32767), int(right * 32767)))
                  wav.writeframes(frames)
          print(f"Created original 60-second soundtrack: {output}")
          PYCODE

      - name: Add built-in background music
        shell: bash
        env:
          INCLUDE_AUDIO: ${{ github.event_name != 'workflow_dispatch' || inputs.include_audio }}
        run: |
          set -euo pipefail

          if [[ "${INCLUDE_AUDIO:-true}" == "true" ]]; then
            ffmpeg -hide_banner -loglevel error -y \
              -i build/promo-silent.mp4 \
              -i build/skym3u-original-soundtrack.wav \
              -map 0:v:0 -map 1:a:0 \
              -t 60 \
              -c:v copy \
              -c:a aac -b:a 128k -ar 48000 -ac 2 \
              -shortest \
              -movflags +faststart \
              build/promo-final.mp4
            echo "Original Skym3u background soundtrack enabled."
          else
            cp build/promo-silent.mp4 build/promo-final.mp4
            echo "Audio disabled by workflow input."
          fi

      - name: Package as HLS
        run: |
          set -euo pipefail

          ffmpeg -hide_banner -loglevel error -y \
            -i build/promo-final.mp4 \
            -map 0:v:0 -map 0:a? \
            -c:v libx264 -preset veryfast -crf 22 \
            -pix_fmt yuv420p -r 30 \
            -g 150 -keyint_min 150 -sc_threshold 0 \
            -force_key_frames "expr:gte(t,n_forced*5)" \
            -c:a aac -b:a 128k -ar 48000 \
            -f hls \
            -hls_time 5 \
            -hls_list_size 0 \
            -hls_playlist_type vod \
            -hls_flags independent_segments \
            -hls_segment_filename "stream/segment_%03d.ts" \
            stream/stream.m3u8

          echo "HLS output:"
          ls -lh stream/
          test -s stream/stream.m3u8

      - name: Commit and push HLS stream
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stream/
          if git diff --cached --quiet; then
            echo "No HLS changes to commit."
            exit 0
          fi

          git commit -m "Build Skym3u ultimate rotating promo stream"
          git push origin "HEAD:${GITHUB_REF_NAME}"
