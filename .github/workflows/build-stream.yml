name: Generate Promo Stream

on:
  push:
    paths:
      - 'messages.txt'
      - '.github/workflows/build-stream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & System Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Generate Animated M3U8 Stream
        run: |
          mkdir -p stream
          # লিনাক্সের বিল্ট-ইন স্ট্যান্ডার্ড ফন্ট ব্যবহার করা হলো, কোনো ডাউনলোডের ঝামেলা নেই!
          ffmpeg -f lavfi -i color=c=black:s=1280x720:r=30 -t 20 \
          -vf "drawtext=fontfile=/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf:textfile=messages.txt:fontcolor=yellow:fontsize=56:x=(w-text_w)/2:y=h-(t*50):shadowcolor=black:shadowx=3:shadowy=3" \
          -c:v libx264 -preset veryfast -g 60 -sc_threshold 0 \
          -hls_time 5 -hls_list_size 0 -hls_segment_filename "stream/seg_%03d.ts" \
          stream/stream.m3u8

      - name: Push to GitHub
        run: |
          git config user.name "Auto Bot"
          git config user.email "bot@github.com"
          git add stream/
          git commit -m "Generate stream with local system font" || exit 0
          git push
