name: Generate Modern Promo Stream

on:
  push:
    paths:
      - 'messages.txt'
      - '.github/workflows/build-stream.yml'
      - 'font.ttf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Perfect Unicode Bengali Stream
        run: |
          mkdir -p stream
          
          # messages.txt থেকে একটি নিখুঁত সাবটাইটেল (SRT) ফাইল তৈরি করা হচ্ছে যা বাংলা যুক্তাক্ষর ভাঙতে দেবে না
          echo "1" > promo.srt
          echo "00:00:00,000 --> 00:00:25,000" >> promo.srt
          cat messages.txt >> promo.srt

          # সাবটাইটেল ফিল্টার (subtitles) ব্যবহার করে নিখুঁত বাংলা রেন্ডারিং
          ffmpeg -f lavfi -i color=c=0x111111:s=1280x720:r=30 -t 25 \
          -vf "subtitles=promo.srt:force_style='FontName=Noto Sans Bengali,FontSize=28,PrimaryColour=&H00FFFF&,OutlineColour=&H000000&,BorderStyle=3,Outline=2,Shadow=2,Alignment=2'" \
          -c:v libx264 -preset veryfast -g 60 -sc_threshold 0 \
          -hls_time 5 -hls_list_size 0 -hls_segment_filename "stream/seg_%03d.ts" \
          stream/stream.m3u8

      - name: Push to GitHub
        run: |
          git config user.name "Promo Bot"
          git config user.email "bot@github.com"
          git add stream/
          git commit -m "Fix Bengali conjunct rendering using SRT subtitles" || exit 0
          git push
